name: Build

on:
  push:
    branches: [main, 1.21.4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine MC version
        id: mc
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$MC" >> $GITHUB_OUTPUT
          echo "Building for MC $MC"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename jar
        run: |
          mkdir -p artifacts
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -1)
          cp "$JAR" artifacts/imc-restaurant-cooking-1.0.0-MC${{ steps.mc.outputs.version }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imc-restaurant-cooking-MC${{ steps.mc.outputs.version }}
          path: artifacts/*.jar
